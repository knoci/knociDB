name: Go

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build -v ./...

      - name: Vet
        run: go vet ./...

      - name: Test (with coverage on Linux)
        if: matrix.os == 'ubuntu-latest'
        run: go test -count=1 -coverprofile=coverage.txt -timeout 15m ./...

      - name: Test (Windows/macOS)
        if: matrix.os != 'ubuntu-latest'
        run: go test -count=1 -timeout 15m ./...

      - name: Race detector (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: go test -race -count=1 -timeout 20m ./...

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_ORG_TOKEN }}
          files: coverage.txt
